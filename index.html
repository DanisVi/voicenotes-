<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#007AFF" />
    <link rel="icon" type="image/svg+xml" href="/voicenotes-/icon-192.svg" />
    <link rel="manifest" href="/voicenotes-/manifest.webmanifest" />
  <title>VoiceNotes Pro</title>
    <script>
      (function() {
        try {
          var m = localStorage.getItem("voicenotes_theme") || "auto";
          var dark = m === "dark" ||
            (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW register failed", e));
        });
      }
    </script>
</body>
</html>
